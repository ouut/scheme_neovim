[package]
name = "steel-ide"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity"]
description = "All-in-One portable Steel Scheme IDE powered by Neovim and Strict Paredit"

[dependencies]
flate2 = "1.0"
tar = "0.4"
dirs = "5.0"
sha2 = "0.10"

[build-dependencies]
flate2 = "1.0"
tar = "0.4"
walkdir = "2.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
