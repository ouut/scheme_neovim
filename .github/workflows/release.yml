name: Release Cross-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.2.1)'
        required: false
        default: 'v0.2.1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.release_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Linux x86_64 (Ubuntu)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: steel-ide
            release_name: steel-ide-linux-x86_64
            nvim_url: https://github.com/neovim/neovim/releases/download/v0.10.4/nvim-linux-x86_64.tar.gz
            nvim_archive_type: tar
            steel_url: https://github.com/mattwparas/steel/releases/download/v0.8.2/steel-interpreter-x86_64-unknown-linux-gnu.tar.xz
            steel_archive_type: tar_xz

          # 2. macOS Apple Silicon (M1/M2/M3/M4)
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: steel-ide
            release_name: steel-ide-macos-arm64
            nvim_url: https://github.com/neovim/neovim/releases/download/v0.10.4/nvim-macos-arm64.tar.gz
            nvim_archive_type: tar
            steel_url: https://github.com/mattwparas/steel/releases/download/v0.8.2/steel-interpreter-aarch64-apple-darwin.tar.xz
            steel_archive_type: tar_xz

          # 3. Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: steel-ide.exe
            release_name: steel-ide-windows-x86_64.exe
            nvim_url: https://github.com/neovim/neovim/releases/download/v0.10.4/nvim-win64.zip
            nvim_archive_type: zip
            steel_url: https://github.com/mattwparas/steel/releases/download/v0.8.2/steel-interpreter-x86_64-pc-windows-msvc.zip
            steel_archive_type: zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # -----------------------------------------------------------------------
      # Step 1: Install Official Prebuilt Neovim 0.10.4
      # -----------------------------------------------------------------------
      - name: Install Prebuilt Neovim
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ROOT_DIR=$(cygpath -m "$HOME")
          else
            ROOT_DIR="$HOME"
          fi
          mkdir -p "$ROOT_DIR/opt_nvim"

          if [ "${{ matrix.nvim_archive_type }}" = "tar" ]; then
            curl -fLo nvim_archive.tar.gz "${{ matrix.nvim_url }}"
            tar -xzf nvim_archive.tar.gz -C "$ROOT_DIR/opt_nvim" --strip-components=1
            echo "$ROOT_DIR/opt_nvim/bin" >> $GITHUB_PATH
            echo "NVIM_BIN_PATH=$ROOT_DIR/opt_nvim/bin/nvim" >> $GITHUB_ENV
            echo "NVIM_RUNTIME_PATH=$ROOT_DIR/opt_nvim/share/nvim/runtime" >> $GITHUB_ENV
          elif [ "${{ matrix.nvim_archive_type }}" = "zip" ]; then
            curl -fLo nvim_archive.zip "${{ matrix.nvim_url }}"
            unzip -q nvim_archive.zip -d "$ROOT_DIR/opt_nvim_tmp"
            mv "$ROOT_DIR/opt_nvim_tmp/nvim-win64"/* "$ROOT_DIR/opt_nvim/"
            echo "$ROOT_DIR/opt_nvim/bin" >> $GITHUB_PATH
            echo "NVIM_BIN_PATH=$ROOT_DIR/opt_nvim/bin/nvim.exe" >> $GITHUB_ENV
            echo "NVIM_RUNTIME_PATH=$ROOT_DIR/opt_nvim/share/nvim/runtime" >> $GITHUB_ENV
          fi

      # -----------------------------------------------------------------------
      # Step 2: Install Official Prebuilt Steel Scheme 0.8.2
      # -----------------------------------------------------------------------
      - name: Install Prebuilt Steel Scheme
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ROOT_DIR=$(cygpath -m "$HOME")
          else
            ROOT_DIR="$HOME"
          fi
          mkdir -p "$ROOT_DIR/opt_steel"

          if [ "${{ matrix.steel_archive_type }}" = "tar_xz" ]; then
            curl -fLo steel_archive.tar.xz "${{ matrix.steel_url }}"
            tar -xJf steel_archive.tar.xz -C "$ROOT_DIR/opt_steel" --strip-components=1
            echo "$ROOT_DIR/opt_steel" >> $GITHUB_PATH
            echo "STEEL_BIN_PATH=$ROOT_DIR/opt_steel/steel" >> $GITHUB_ENV
          elif [ "${{ matrix.steel_archive_type }}" = "zip" ]; then
            curl -fLo steel_archive.zip "${{ matrix.steel_url }}"
            unzip -q -o steel_archive.zip -d "$ROOT_DIR/opt_steel"
            echo "$ROOT_DIR/opt_steel" >> $GITHUB_PATH
            echo "STEEL_BIN_PATH=$ROOT_DIR/opt_steel/steel.exe" >> $GITHUB_ENV
          fi

      # -----------------------------------------------------------------------
      # Step 3: Bootstrap Plugins & Treesitter Scheme Parser
      # -----------------------------------------------------------------------
      - name: Pre-install Neovim Plugins and Scheme Parser
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ROOT_DIR=$(cygpath -m "$HOME")
          else
            ROOT_DIR="$HOME"
          fi
          PLUGINS_DIR="$ROOT_DIR/bundled_plugins"
          mkdir -p "$PLUGINS_DIR"
          echo "LAZY_PLUGINS_PATH=$PLUGINS_DIR" >> $GITHUB_ENV
          export LAZY_PLUGINS_PATH="$PLUGINS_DIR"

          # Clone plugins directly for 100% offline self-contained bundling
          git clone --depth 1 https://github.com/folke/tokyonight.nvim "$PLUGINS_DIR/tokyonight.nvim"
          git clone --depth 1 -b master https://github.com/nvim-treesitter/nvim-treesitter "$PLUGINS_DIR/nvim-treesitter"
          git clone --depth 1 https://github.com/julienvincent/nvim-paredit "$PLUGINS_DIR/nvim-paredit"
          git clone --depth 1 https://github.com/sundbp/strict-paredit.nvim "$PLUGINS_DIR/strict-paredit.nvim"

          # Verify binaries work
          "$NVIM_BIN_PATH" --version
          "$STEEL_BIN_PATH" --version

          # Pre-compile Tree-sitter scheme parser
          "$NVIM_BIN_PATH" --headless -u init.lua "+TSInstallSync scheme query" +qa || true

      # -----------------------------------------------------------------------
      # Step 4: Build Standalone All-in-One Binary with Rust
      # -----------------------------------------------------------------------
      - name: Build All-in-One Binary
        shell: bash
        run: |
          cd launcher
          cargo build --release --target ${{ matrix.target }}

      # -----------------------------------------------------------------------
      # Step 5: Prepare Release Asset
      # -----------------------------------------------------------------------
      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          cp launcher/target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.release_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_name }}
          path: dist/${{ matrix.release_name }}

      # -----------------------------------------------------------------------
      # Step 6: Publish to GitHub Release Page
      # -----------------------------------------------------------------------
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          files: dist/${{ matrix.release_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
