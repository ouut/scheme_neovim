name: Release Cross-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: steel-ide
            release_name: steel-ide-linux-x86_64
          # macOS Apple Silicon
          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: steel-ide
            release_name: steel-ide-macos-arm64
          # macOS Intel
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: steel-ide
            release_name: steel-ide-macos-x86_64
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: steel-ide.exe
            release_name: steel-ide-windows-x86_64.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install Prebuilt Neovim
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            curl -LO https://github.com/neovim/neovim/releases/download/v0.10.4/nvim-linux-x86_64.tar.gz
            mkdir -p /opt/nvim
            tar -xzf nvim-linux-x86_64.tar.gz -C /opt/nvim --strip-components=1
            echo "NVIM_BIN_PATH=/opt/nvim/bin/nvim" >> $GITHUB_ENV
            echo "NVIM_RUNTIME_PATH=/opt/nvim/share/nvim/runtime" >> $GITHUB_ENV
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew install neovim
            echo "NVIM_BIN_PATH=$(which nvim)" >> $GITHUB_ENV
            echo "NVIM_RUNTIME_PATH=$(brew --prefix neovim)/share/nvim/runtime" >> $GITHUB_ENV
          elif [ "${{ runner.os }}" = "Windows" ]; then
            choco install neovim
            echo "NVIM_BIN_PATH=C:\\tools\\neovim\\bin\\nvim.exe" >> $GITHUB_ENV
            echo "NVIM_RUNTIME_PATH=C:\\tools\\neovim\\share\\nvim\\runtime" >> $GITHUB_ENV
          fi

      - name: Install Steel Scheme
        shell: bash
        run: |
          cargo install steel-lang
          echo "STEEL_BIN_PATH=$(which steel || echo $HOME/.cargo/bin/steel)" >> $GITHUB_ENV

      - name: Build All-in-One Binary
        shell: bash
        run: |
          cd launcher
          cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          cp launcher/target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.release_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_name }}
          path: dist/${{ matrix.release_name }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.release_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
